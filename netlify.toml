# Netlify configuration for the IMU Balance Board dashboards.
#
# The dashboards are plain static HTML in dashboards/ and are published at the
# site root (so https://<site>/steadysteps.html, /testingdashboard.html, ...).
# The Airtable Personal Access Token NEVER ships to the browser — it lives in a
# Netlify environment variable (AIRTABLE_PAT) read only by the functions below.

[build]
  publish    = "dashboards"
  functions  = "netlify/functions"

[build.environment]
  # AIRTABLE_BASE_ID is not a secret (it's like a database name) and appears in
  # the code/docs by design, so exclude it from Netlify's secrets scanner. The
  # real secret, AIRTABLE_PAT, is NOT in any committed file and is still scanned.
  SECRETS_SCAN_OMIT_KEYS = "AIRTABLE_BASE_ID"

# The site root serves the SteadySteps game so players land straight in it.
# There is no index.html (the dashboards are standalone pages), so without this
# redirect the bare "/" URL 404s. The testing dashboard is intentionally NOT
# linked from anywhere — reach it directly at /testingdashboard.html.
[[redirects]]
  from   = "/"
  to     = "/steadysteps.html"
  status = 302

# Local dev: `netlify dev` serves dashboards/ and the functions on one origin
# (http://localhost:8888) so the browser can call /.netlify/functions/* with no
# CORS and the .env token stays server-side.
[dev]
  publish = "dashboards"
