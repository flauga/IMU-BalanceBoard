[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 921600
; Pre-build patch: adds SO_SNDTIMEO to the WebSockets library so that
; broadcastBIN/sendTXT can't block for more than WEBSOCKETS_TCP_TIMEOUT ms
; when a slow client fills the TCP send buffer. See patch_websockets.py.
extra_scripts = pre:patch_websockets.py
lib_deps =
    sparkfun/SparkFun Qwiic 6Dof - LSM6DSO
    links2004/WebSockets
build_flags =
    -D USE_MAHONY_FILTER
    ; Note: CONFIG_MDNS_TASK_PRIORITY / AFFINITY are pre-baked into the
    ; Arduino-ESP32 IDF build (sdkconfig.h), so user build flags can't
    ; override them. The mDNS task therefore runs at its default priority.
    ; If mDNS ever causes stalls again, the only real fix is MDNS_ENABLED=0
    ; in include/config.h and connecting by direct IP.
    ; WebSockets library default TCP write timeout is 5000 ms — far too long.
    ; If the browser is briefly slow (JS GC pause, tab refresh, etc.), the
    ; send buffer fills and the broadcast loop blocks for up to 5 seconds.
    ; Cap to 50 ms so a slow client causes dropped frames, not stalls.
    -D WEBSOCKETS_TCP_TIMEOUT=50
    ; Note: configGENERATE_RUN_TIME_STATS / configUSE_TRACE_FACILITY are also
    ; baked into the Arduino-ESP32 FreeRTOSConfig.h. uxTaskGetSystemState()
    ; returns valid task lists regardless; we just can't get CPU-time %.
